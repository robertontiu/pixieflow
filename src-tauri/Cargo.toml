[package]
name = "pixieflow"
version = "0.2.0"
description = "Photo proofing helper: RAW → JPG for Pixieset, then pick the client's RAWs"
authors = ["Robert Ontiu"]
edition = "2021"

[lib]
name = "pixieflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
trash = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
